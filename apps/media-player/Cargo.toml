[package]
name = "nyx-media-player"
version = "0.1.0"
description = "A video player for Omarchy: movies and TV shows library, playlists, subtitles and an equalizer, played with mpv"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-media-player"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-media-player"
path = "src/main.rs"

[dependencies]
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
anyhow = "1.0.104"
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5"
zbus = "5"
